<!DOCTYPE html>
<html>
<head>
    <title>Summary - Finlytics</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

<div class="navbar">
    <h2>Finlytics</h2>

    <div class="nav-links">
        <a href="/">Home</a>
        <a href="/transactions-page">Transactions</a>
        <a href="/upload-page">Upload</a>
        <a href="/summary-page">Summary</a>
    </div>
</div>


<div class="container">

    <h1>Summary</h1>


    <h2>Category Summary</h2>

    <table id="catTable">
        <thead>
        <tr>
            <th>Category</th>
            <th>Total</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>



    <h2>Income vs Expense</h2>

    <table id="typeTable">
        <thead>
        <tr>
            <th>Type</th>
            <th>Total</th>
        </tr>
        </thead>
        <tbody></tbody>
    </table>

    <h2>Charts</h2>

    <div class="chart-grid">

        <div class="chart-box">
            <h3>Category Chart</h3>
            <canvas id="catChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Income vs Expense</h3>
            <canvas id="typeChart"></canvas>
        </div>

        <div class="chart-box">
            <h3>Top Merchants</h3>
            <canvas id="merchantChart"></canvas>
        </div>

    </div>
</div>

<script src="/js/chart.js"></script>
<script src="/js/summary.js"></script>

</body>
</html>
